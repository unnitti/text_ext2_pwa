<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="클립보드 가공">
<link rel="stylesheet" href="style.css">
<title>클립보드 가공</title>
</head>
<body>
<main class="app">
  <header class="app-header">
    <div class="app-icon" aria-hidden="true">
      <span class="icon-sheet"></span>
      <span class="icon-arrow">↑</span>
    </div>
    <div>
      <h1>클립보드 가공</h1>
      <p class="sub">필요한 정보만 깔끔하게 정리합니다.</p>
    </div>
  </header>

  <div class="flow-card">
    <div class="flow-icon" aria-hidden="true">⌁</div>
    <div>
      <strong>클립보드에서 가져오기</strong>
      <p>원문에서 상품코드 · 날짜 · 지번을 찾아 정리합니다.</p>
    </div>
  </div>

  <button id="loadBtn" class="primary">
    <span class="button-icon" aria-hidden="true">↧</span>
    클립보드 불러오기
  </button>

  <section class="panel">
    <div class="section-head">
      <label for="source">원문</label>
      <span>직접 붙여넣기도 가능</span>
    </div>
    <textarea id="source" placeholder="여기를 길게 눌러 붙여넣으세요."></textarea>
  </section>

  <section class="panel result-panel">
    <div class="section-head">
      <label for="result">추출 결과</label>
      <span id="resultCount"></span>
    </div>
    <textarea id="result" placeholder="추출 결과" aria-label="추출 결과"></textarea>
  </section>

  <button id="copyBtn" class="primary" disabled>
    <span class="button-icon" aria-hidden="true">▣</span>
    결과 복사
  </button>

  <div class="status-wrap">
    <span id="statusDot" class="status-dot" aria-hidden="true"></span>
    <p id="status" class="status"></p>
  </div>

  <p class="footer-note">iPhone용 간단한 클립보드 유틸리티</p>
</main>

<script src="app.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
