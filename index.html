<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="클립보드 가공">
  <link rel="stylesheet" href="style.css">
  <title>클립보드 가공</title>
</head>
<body>
  <main class="app">
    <h1>클립보드 가공</h1>
    <p class="sub">업무 텍스트에서 필요한 정보만 추출합니다.</p>

    <button id="loadBtn" class="primary">클립보드 불러오기</button>

    <section>
      <label for="source">원문 (여기를 길게 눌러 붙여넣기 하면 바로 처리돼요)</label>
      <textarea id="source" placeholder="여기를 길게 눌러 붙여넣기 하세요."></textarea>
    </section>

    <section>
      <label for="result">추출 결과</label>
      <textarea id="result" placeholder="추출 결과"></textarea>
    </section>

    <button id="copyBtn" class="primary" disabled>결과 복사</button>
    <p id="status" class="status"></p>
  </main>
  <script src="app.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
